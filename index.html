from ..base import BaseTask

class FastaParserTask(BaseTask):
    """
    BioPythonを使用してFASTA形式のデータをパースするタスク。
    """

    def run(self, fasta_content: str) -> AnalysisResult:
        """
        FASTA文字列をパースし、SequenceRecordのリストを含むAnalysisResultを返す。

        Args:

        Returns:
            AnalysisResult: パースされたレコードを含む結果。

        warnings: list[str] = []

        if not fasta_content.strip():
            return AnalysisResult(records=records, metadata={"warnings": warnings})

        first_non_empty_line = next((line for line in fasta_content.splitlines() if line.strip()), "")
        if first_non_empty_line and not first_non_empty_line.startswith(">"):
            warnings.append("FASTAヘッダ(` + "`" + String.raw`>` + "`" + String.raw`)から始まっていないため、入力形式が不正の可能性があります。")

        # StringIOを使用して文字列をファイルライクオブジェクトとして扱う

        try:
            for record in SeqIO.parse(fasta_io, "fasta"):
                records.append(SequenceRecord(
                    id=str(record.id),
                    description=str(record.description),
                    sequence=str(record.seq),
                    length=len(record.seq)
                ))
        except ValueError as error:
            warnings.append(f"FASTAのパース中に警告が発生しました: {error}")

        return AnalysisResult(records=records, metadata={"warnings": warnings})

class SequenceAnalysisTask(BaseTask):
    """
    BioPythonを使用して配列の統計情報（GC含有量、塩基組成など）を計算するタスク。

    def run(self, records: list[SequenceRecord]) -> AnalysisResult:
        """

            # 塩基組成の計算（1回走査で効率的に集計）
            composition: dict[str, int] = {}
            for base in record.sequence.upper():
                if base.isalpha():
                    composition[base] = composition.get(base, 0) + 1
            record.base_composition = composition
            
        return AnalysisResult(records=records)

    def render(self, result: AnalysisResult) -> None:
        """
        解析結果を表示します。
        """
        from ...ui.components import display_sequence_stats
        display_sequence_stats(result.records)

from io import StringIO
from typing import Optional

def calculate_rbh(forward_tsv: str, reverse_tsv: str) -> pd.DataFrame:
    """
    2つのBLAST結果（TSV形式）から、レシプロカルベストヒット（RBH）を計算します。

    Args:
        forward_tsv (str): クエリAからデータベースBへのBLAST結果。
        reverse_tsv (str): クエリBからデータベースAへのBLAST結果。

    Returns:
        pd.DataFrame: RBHペアのデータフレーム。
    """
    # BLAST outfmt 6 のカラム名
    columns = [
        "query", "subject", "identity", "alignment_length", "mismatches", 
        "gap_opens", "q_start", "q_end", "s_start", "s_end", "evalue", "bitscore"
    ]

    def get_best_hits(tsv_content: str) -> pd.DataFrame:
        if not tsv_content.strip():
            return pd.DataFrame(columns=columns)
        
        df = pd.read_csv(StringIO(tsv_content), sep="\t", names=columns)
        # 各クエリに対して最大の bitscore を持つヒットを抽出
        # 同点時は evalue が最小（最良）のものを優先する
        best_hits = df.sort_values(["bitscore", "evalue"], ascending=[False, True]).drop_duplicates("query")
        return best_hits

    df_ab = get_best_hits(forward_tsv)
    df_ba = get_best_hits(reverse_tsv)

    if df_ab.empty or df_ba.empty:
        return pd.DataFrame(columns=["query_a", "query_b", "identity_a_to_b", "identity_b_to_a", "bitscore_a_to_b", "bitscore_b_to_a"])

    # RBHの条件: AのベストヒットがBであり、かつBのベストヒットがAであること
    # df_ab: query=A_id, subject=B_id
    # df_ba: query=B_id, subject=A_id
    
    # 内部結合で一致するペアを探す
    rbh = pd.merge(
        df_ab, 
        df_ba, 
        left_on=["query", "subject"], 
        right_on=["subject", "query"],
        suffixes=("_fwd", "_rev")
    )

    # 必要なカラムのみ抽出して整理
    result = rbh[[
        "query_fwd", "subject_fwd", "identity_fwd", "identity_rev", "bitscore_fwd", "bitscore_rev"
    ]].rename(columns={
        "query_fwd": "query_a",
        "subject_fwd": "query_b",
        "identity_fwd": "identity_a_to_b",
        "identity_rev": "identity_b_to_a",
        "bitscore_fwd": "bitscore_a_to_b",
        "bitscore_rev": "bitscore_b_to_a"
    })

    return result

def get_identity_stats(rbh_df: pd.DataFrame) -> dict:
    """
    RBHの結果からIdentityの統計情報を取得します。
    
    Args:
        rbh_df (pd.DataFrame): calculate_rbh で取得したデータフレーム。
        
    Returns:
        dict: 平均、中央値、カウントなどの統計。
    """
    if rbh_df.empty:
        return {"count": 0, "mean": 0.0, "median": 0.0}
    
    # identity_a_to_b を統計の対象とする
    stats = {
        "count": len(rbh_df),
        "mean": float(rbh_df["identity_a_to_b"].mean()),
        "median": float(rbh_df["identity_a_to_b"].median()),
        "min": float(rbh_df["identity_a_to_b"].min()),
        "max": float(rbh_df["identity_a_to_b"].max()),
    }
    return stats

from pyodide.ffi import to_js

class BiowasmBridge:
    """
    JavaScript側のAioliライブラリを介してWasmバイオ情報学ツールを呼び出すためのブリッジ。
    """

    def __init__(self):
        self.initialized = True

    @staticmethod
    def _quote_cli_arg(value: str) -> str:
        escaped = value.replace("\\", "\\\\").replace('"', '\\"')
        return f'"{escaped}"'

    async def run_tool(self, tool: str, args: str, files: dict[str, str] = None) -> str:
        """
        Wasmツールを実行します。
        files: { "filename": "content" } の辞書。Aioliにマウントされます。
        """
        py_debug = [
            f"[PY] tool={tool}",
            f"[PY] args={args}",
        ]

        # JSに渡すためのファイルデータを一時的にグローバルに配置（eval内で参照するため）
        if files:
            js._pyowasm_files = to_js(files)
        else:
            js._pyowasm_files = None

        try:
            # 入力ファイルの有無を判定
            use_legacy_upload = (not files) and ("input.fasta" in args)
            py_debug.append(f"[PY] has_files={bool(files) or use_legacy_upload}")

            # f-string でJSコードを組み立てる際の注入/構文崩れを防ぐため、
            # 外部入力は JSON 文字列リテラルとして埋め込む。
            tool_js = json.dumps(tool, ensure_ascii=False)
            args_js = json.dumps(args, ensure_ascii=False)
            legacy_upload_js = "true" if use_legacy_upload else "false"

            js_code = f"""
            (async () => {{
                const debugLogs = [];
                const log = (...items) => {{
                    const line = items
                        .map((item) => {{
                            if (typeof item === "string") return item;
                            try {{
                                return JSON.stringify(item);
                            }} catch (_e) {{
                                return String(item);
                            }}
                        }})
                        .join(" ");
                    debugLogs.push(line);
                    try {{
                        console.log("[Pyowasm][debug]", ...items);
                    }} catch (_e) {{}}
                }};

                try {{
                    const toolName = {tool_js};
                    const rawArgs = {args_js};

                    log("start", {{ tool: toolName, args: rawArgs }});

                    // 1. Aioli ロード
                    if (typeof Aioli === 'undefined') {{
                        log("Aioli not found, trying dynamic import");
                        try {{
                            const module = await import('https://biowasm.com/cdn/v3/aioli.js');
                            if (module.default) {{
                                globalThis.Aioli = module.default;
                                log("Aioli resolved from module.default");
                            }} else if (typeof globalThis.Aioli === 'undefined') {{
                                for (const key in module) {{
                                    if (typeof module[key] === 'function') {{
                                        globalThis.Aioli = module[key];
                                        log("Aioli resolved from module key", key);
                                        break;
                                    }}
                                }}
                            }}
                        }} catch (e) {{
                            log("dynamic import failed", e?.message || String(e));
                        }}
                    }}

                    if (typeof globalThis.Aioli !== 'function') {{
                         throw new Error("Aioli could not be loaded as a constructor.");
                    }}

                    // 2. 初期化
                    if (!globalThis._pyowasm_clis) globalThis._pyowasm_clis = {{}};
                    if (!globalThis._pyowasm_clis[toolName]) {{
                        log("creating new Aioli instance", toolName);
                        globalThis._pyowasm_clis[toolName] = await new Aioli([toolName]);
                    }}
                    const cli = globalThis._pyowasm_clis[toolName];
                    log("cli ready", !!cli);

                    // 3. マウント処理
                    let commandToExec = rawArgs;
                    const filesToMount = [];
                    const jsFiles = globalThis._pyowasm_files;

                    if (jsFiles && typeof jsFiles.entries === "function") {{
                        for (const [name, content] of jsFiles.entries()) {{
                            filesToMount.push({{
                                name: name,
                                data: new Blob([new TextEncoder().encode(content)])
                            }});
                        }}
                    }}

                    // レガシー互換: _pyowasm_upload_text を使用
                    if ({legacy_upload_js} && !filesToMount.some(f => f.name === "input.fasta")) {{
                        const uploadText = globalThis._pyowasm_upload_text;
                        if (typeof uploadText === "string") {{
                            filesToMount.push({{
                                name: "input.fasta",
                                data: new Blob([new TextEncoder().encode(uploadText)])
                            }});
                        }}
                    }}

                    if (filesToMount.length > 0) {{
                        log("mounting files", filesToMount.map(f => f.name));
                        const mountedPaths = await cli.mount(filesToMount);
                        log("mountedPaths", mountedPaths);

                        const resolvePath = (val) => {{
                            if (!val) return null;
                            if (typeof val === "string") return val;
                            return val.path || val.mountPath || val.file || val.name || null;
                        }};

                        const tokenizeCommand = (command) => {{
                            const matches = command.match(/[^\\s"']+|"(?:\\\\.|[^"])*"|'(?:\\\\.|[^'])*'/g);
                            return matches || [];
                        }};

                        const normalizeToken = (token) => {{
                            if (token.length >= 2 && token[0] === '"' && token[token.length - 1] === '"') {{
                                return token.slice(1, -1).replace(/\\\\"/g, '"');
                            }}
                            if (token.length >= 2 && token[0] === "'" && token[token.length - 1] === "'") {{
                                return token.slice(1, -1).replace(/\\\\'/g, "'");
                            }}
                            return token;
                        }};

                        const formatPathToken = (path) => {{
                            if (/\\s/.test(path)) {{
                                return JSON.stringify(path);
                            }}
                            return path;
                        }};

                        let commandTokens = tokenizeCommand(commandToExec);

                        for (let i = 0; i < filesToMount.length; i++) {{
                            const originalName = filesToMount[i].name;
                            const mountedPath = resolvePath(mountedPaths[i]);
                            if (mountedPath) {{
                                commandTokens = commandTokens.map((token) =>
                                    normalizeToken(token) === originalName ? formatPathToken(mountedPath) : token
                                );
                            }}
                        }}
                        commandToExec = commandTokens.join(" ");
                        log("finalCommand", commandToExec);
                    }}

                    log("executing", commandToExec);
                    const result = await cli.exec(commandToExec);
                    log("exec completed");
                    return JSON.stringify({{ status: "success", data: result, debug: debugLogs }});

                }} catch (e) {{
                    log("bridgeError", e?.message || String(e));
                    return JSON.stringify({{ status: "error", message: e.message || String(e), debug: debugLogs }});
                }} finally {{
                    // 一時変数のクリア
                    delete globalThis._pyowasm_files;
                }}
            }})()
            """
            
            js_response_json = await js.eval(js_code)
            py_debug.append(f"[PY] js_response_json={js_response_json}")
            response = json.loads(js_response_json)
            js_debug = response.get("debug") or []
            trace = "\n".join(py_debug + [f"[JS] {line}" for line in js_debug])
            
            if response["status"] == "success":
                data = response.get("data")
                if isinstance(data, dict):
                    stdout = str(data.get("stdout") or "")
                    stderr = str(data.get("stderr") or "")
                    exit_code = data.get("exitCode", data.get("code"))

                    if exit_code not in (None, 0):
                        message = stderr or stdout or str(data)
                        return f"Wasm実行エラー: {message}\n\n--- Debug Trace ---\n{trace}"
                    return stdout or stderr or json.dumps(data, ensure_ascii=False)

                return str(data)
            else:
                return f"Wasm実行エラー: {response['message']}\n\n--- Debug Trace ---\n{trace}"
            
        except Exception as e:
            py_debug.append(f"[PY] exception={str(e)}")
            trace = "\n".join(py_debug)
            return f"ブリッジ通信エラー: {str(e)}\n\n--- Debug Trace ---\n{trace}"

    async def smith_waterman(self, query_sequence: str, subject_sequence: str) -> str:
        """
        seq-align の smith_waterman を実行します。
        2 配列を直接引数で渡し、アラインメント結果のテキストを返します。
        """
        command = (
            f"smith_waterman {self._quote_cli_arg(query_sequence)} "
            f"{self._quote_cli_arg(subject_sequence)}"
        )
        return await self.run_tool("seq-align/smith_waterman/2017.10.18", command)

    async def seqtk(self, command: str, files: dict[str, str] = None) -> str:
        """
        seqtkを実行します。
        """
        full_command = command.strip()
        if not full_command.startswith("seqtk"):
            full_command = f"seqtk {full_command}"
        return await self.run_tool("seqtk/1.3", full_command, files=files)

    def write_to_vfs(self, filename: str, content: str) -> str:
        """
        Python側の文字列データをEmscriptenの仮想FSに書き出します。
        """
        try:
            js.FS.writeFile(filename, content)
            js._pyowasm_upload_text = content
            js.console.log(f"[Pyowasm] File written to VFS: {filename} ({len(content)} bytes)")
            return filename
        except Exception as e:
            js.console.error(f"[Pyowasm] Failed to write to VFS: {str(e)}")
            js._pyowasm_upload_text = content
            import os
            os.makedirs(os.path.dirname(filename) if os.path.dirname(filename) else ".", exist_ok=True)
            with open(filename, "w") as f:
                f.write(content)
            return filename

import re
from collections import defaultdict
from io import StringIO
from Bio import SeqIO
from Bio.Seq import Seq
from Bio.SeqRecord import SeqRecord
from Bio.Align import PairwiseAligner, substitution_matrices
from ..base import BaseTask

ALLOWED_AMINO_ACIDS = set(substitution_matrices.load("BLOSUM62").alphabet)

class OrthologAnalysisTask(BaseTask):
    """
    k-mer 候補絞り込み + BioPython PairwiseAligner を使用して 2 種間のオーソログ解析（RBH）を行うタスク。
    """

    def __init__(self) -> None:
        """直近の入力検証結果を保持する。"""
        self.last_warnings: list[str] = []
        self.last_excluded_records: list[dict[str, object]] = []

    @staticmethod
    def _normalize_fasta_content(fasta_content: str) -> str:
        """FASTA 文字列全体から BOM と行末空白を除去する。"""
        cleaned = fasta_content.replace("\ufeff", "")
        return "\n".join(line.rstrip() for line in cleaned.splitlines())

    @staticmethod
    def _normalize_sequence(sequence: str) -> str:
        """配列文字列をアラインメント前に正規化する。"""
        return sequence.replace("\ufeff", "").strip().upper()

    def _sanitize_sequences(self, records: list[SeqRecord], species_label: str) -> list[SeqRecord]:
        """配列を正規化し、BLOSUM62 非対応文字を含むレコードを除外する。"""
        sanitized_records: list[SeqRecord] = []

        for record in records:
            normalized = self._normalize_sequence(str(record.seq))
            invalid_chars = sorted(set(normalized) - ALLOWED_AMINO_ACIDS)

            if invalid_chars:
                self.last_excluded_records.append({
                    "species": species_label,
                    "record_id": record.id,
                    "invalid_chars": "".join(invalid_chars),
                    "length": len(normalized),
                })
                continue

            sanitized_records.append(
                SeqRecord(Seq(normalized), id=record.id, description=record.description)
            )

        return sanitized_records

    @staticmethod
    def _normalize_text_for_keyword_match(text: str) -> str:
        """キーワード照合用に区切り文字を空白へ寄せて正規化する。"""
        normalized = text.replace("_", " ").replace("-", " ").lower()
        return re.sub(r"\s+", " ", normalized).strip()

    def _filter_records_by_keywords(
        self,
        records: list[SeqRecord],
        species_label: str,
        keywords: list[str],
    ) -> list[SeqRecord]:
        """description にキーワードを含むレコードのみ残す。"""
        cleaned_keywords = [k.strip() for k in keywords if k and k.strip()]
        if not cleaned_keywords:
            return records

        pattern = re.compile(
            "|".join(re.escape(self._normalize_text_for_keyword_match(k)) for k in cleaned_keywords),
            re.IGNORECASE,
        )

        selected: list[SeqRecord] = []
        for record in records:
            normalized_description = self._normalize_text_for_keyword_match(record.description)
            if pattern.search(normalized_description):
                selected.append(record)

        filtered_out = len(records) - len(selected)
        self.last_warnings.append(
            f"{species_label} をキーワード抽出しました（キーワード {len(cleaned_keywords)}件、"
            f"抽出 {len(selected)}件、除外 {filtered_out}件）。"
        )
        return selected

    def _update_validation_summary(self) -> None:
        """除外レコード数に応じた警告メッセージを更新する。"""
        if not self.last_excluded_records:
            return

        counts: dict[str, int] = {}
        for record in self.last_excluded_records:
            species = str(record["species"])
            counts[species] = counts.get(species, 0) + 1

        summary = "、".join(f"{species} {count}件" for species, count in counts.items())
        total = len(self.last_excluded_records)
        self.last_warnings.append(
            f"BLOSUM62 非対応文字を含むレコードを除外して続行しました（{summary}、合計 {total}件）。"
        )

    @staticmethod
    def _build_kmer_index(seqs: list[SeqRecord], k: int = 4) -> dict[str, set[str]]:
        """k-mer インデックスを構築する。

        Returns:
            {kmer文字列: {seq_id, ...}} の辞書
        """
        index: dict[str, set[str]] = defaultdict(set)
        for record in seqs:
            seq = str(record.seq)
            for i in range(len(seq) - k + 1):
                index[seq[i:i + k]].add(record.id)
        return index

    @staticmethod
    def _get_candidates(
        query_record: SeqRecord,
        subject_index: dict[str, set[str]],
        subject_kmer_sets: dict[str, set[str]],
        top_n: int = 20,
        k: int = 4,
    ) -> list[tuple[str, float]]:
        """クエリに対して Jaccard 類似度上位 top_n の候補 subject ID を返す。

        Returns:
            [(seq_id, jaccard_score), ...] (降順ソート済み)
        """
        query_seq = str(query_record.seq)
        query_kmers = set(query_seq[i:i + k] for i in range(len(query_seq) - k + 1))

        shared_counts: dict[str, int] = {}
        for kmer in query_kmers:
            if kmer in subject_index:
                for sid in subject_index[kmer]:
                    shared_counts[sid] = shared_counts.get(sid, 0) + 1

        if not shared_counts:
            return []

        candidates: list[tuple[str, float]] = []
        for sid, shared in shared_counts.items():
            subject_kmers = subject_kmer_sets[sid]
            union = len(query_kmers) + len(subject_kmers) - shared
            jaccard = shared / union if union > 0 else 0.0
            candidates.append((sid, jaccard))

        candidates.sort(key=lambda x: x[1], reverse=True)
        return candidates[:top_n]

    def _compute_best_hits_fast(
        self,
        seqs_query: list[SeqRecord],
        seqs_subject: list[SeqRecord],
        k: int = 4,
        top_n: int = 20,
    ) -> pd.DataFrame:
        """k-mer 候補絞り込み + PairwiseAligner で各クエリの最良ヒットを計算する。

        全組合せ (N×M) ではなく、k-mer Jaccard 類似度上位 top_n 候補のみ
        精密アラインメントを実施して処理量を削減する。
        """
        # subject の k-mer インデックスと k-mer 集合を構築
        subject_index = self._build_kmer_index(seqs_subject, k)
        subject_dict = {r.id: r for r in seqs_subject}
        subject_kmer_sets: dict[str, set[str]] = {
            r.id: set(str(r.seq)[i:i + k] for i in range(len(str(r.seq)) - k + 1))
            for r in seqs_subject
        }

        aligner = PairwiseAligner()
        aligner.substitution_matrix = substitution_matrices.load("BLOSUM62")
        aligner.open_gap_score = -11
        aligner.extend_gap_score = -1

        self_scores = {r.id: aligner.score(str(r.seq), str(r.seq)) for r in seqs_query}

        rows: list[dict[str, float | str]] = []
        total_aligned = 0

        for query_record in seqs_query:
            candidates = self._get_candidates(
                query_record, subject_index, subject_kmer_sets, top_n, k
            )

            # k-mer に共通部分がない場合は全 subject を対象にして精密アラインメント
            if not candidates:
                candidates = [(r.id, 0.0) for r in seqs_subject]

            best_score: float | None = None
            best_sid: str | None = None

            for sid, _ in candidates:
                s_record = subject_dict[sid]
                sc = aligner.score(str(query_record.seq), str(s_record.seq))
                total_aligned += 1
                if best_score is None or sc > best_score:
                    best_score = sc
                    best_sid = sid

            if best_sid is not None and best_score is not None:
                ss = self_scores[query_record.id]
                identity = min(best_score / ss * 100, 100.0) if ss > 0 else 0.0
                rows.append({
                    "query": query_record.id,
                    "subject": best_sid,
                    "identity": identity,
                    "bitscore": float(best_score),
                })

        total_pairs = len(seqs_query) * len(seqs_subject)
        self.last_warnings.append(
            f"k-mer候補絞り込み完了: {total_aligned:,}ペアのみ精密アラインメントを実施"
            f"（全組合せ {total_pairs:,}ペアから削減、k={k}、top_n={top_n}）"
        )

        return pd.DataFrame(rows) if rows else pd.DataFrame(columns=["query", "subject", "identity", "bitscore"])

    async def run(
        self,
        sample_a: str,
        sample_b: str,
        keywords_a: list[str] | None = None,
        keywords_b: list[str] | None = None,
        k: int = 4,
        top_n: int = 20,
    ) -> pd.DataFrame:
        """k-mer 候補絞り込み + PairwiseAligner で 2 種間の RBH（相互最良ヒット）解析を行う。"""
        self.last_warnings = []
        self.last_excluded_records = []
        empty = pd.DataFrame(columns=["query_a", "query_b", "identity_a_to_b", "identity_b_to_a", "bitscore_a_to_b", "bitscore_b_to_a"])

        # FASTA パース
        normalized_a = self._normalize_fasta_content(sample_a)
        normalized_b = self._normalize_fasta_content(sample_b)
        seqs_a = list(SeqIO.parse(StringIO(normalized_a), "fasta"))
        seqs_b = list(SeqIO.parse(StringIO(normalized_b), "fasta"))

        if not seqs_a or not seqs_b:
            return empty

        # キーワード抽出
        if keywords_a:
            seqs_a = self._filter_records_by_keywords(seqs_a, "Species A", keywords_a)
        if keywords_b:
            seqs_b = self._filter_records_by_keywords(seqs_b, "Species B", keywords_b)

        if not seqs_a or not seqs_b:
            return empty

        # 配列正規化
        seqs_a = self._sanitize_sequences(seqs_a, "Species A")
        seqs_b = self._sanitize_sequences(seqs_b, "Species B")

        if not seqs_a or not seqs_b:
            return empty

        self._update_validation_summary()

        # A→B および B→A の最良ヒットを k-mer + PairwiseAligner で計算
        df_ab = self._compute_best_hits_fast(seqs_a, seqs_b, k=k, top_n=top_n)
        df_ba = self._compute_best_hits_fast(seqs_b, seqs_a, k=k, top_n=top_n)

        if df_ab.empty or df_ba.empty:
            self.last_warnings.append("配列検索でヒットが見つかりませんでした。")
            return empty

        # RBH（相互最良ヒット）検出
        rbh = pd.merge(
            df_ab, df_ba,
            left_on=["query", "subject"],
            right_on=["subject", "query"],
            suffixes=("_fwd", "_rev")
        )

        if rbh.empty:
            self.last_warnings.append("相互最良ヒット（RBH）が見つかりませんでした。")
            return empty

        self.last_warnings.append(
            f"✅ RBH解析完了: {len(rbh)}件のオーソログを検出しました（k-mer k={k}、top_n={top_n}）"
        )

        return rbh[["query_fwd", "subject_fwd", "identity_fwd", "identity_rev", "bitscore_fwd", "bitscore_rev"]].rename(columns={
            "query_fwd": "query_a",
            "subject_fwd": "query_b",
            "identity_fwd": "identity_a_to_b",
            "identity_rev": "identity_b_to_a",
            "bitscore_fwd": "bitscore_a_to_b",
            "bitscore_rev": "bitscore_b_to_a",
        })
