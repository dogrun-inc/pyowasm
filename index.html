      const schemaCode = "from dataclasses import dataclass\nfrom typing import List, Optional\n\n@dataclass\nclass SequenceRecord:\n    \"\"\"\n    塩基配列またはアミノ酸配列の個別のレコードを保持するデータクラス。\n    \"\"\"\n    id: str\n    description: str\n    sequence: str\n    length: int\n    gc_content: float = 0.0\n    base_composition: Optional[dict[str, int]] = None\n\n@dataclass\nclass AnalysisResult:\n    \"\"\"\n    解析全体の実行結果を保持するデータクラス。\n    \"\"\"\n    records: List[SequenceRecord]\n    metadata: Optional[dict] = None\n";

      const baseTaskCode = "from abc import ABC, abstractmethod\nfrom typing import Any\nfrom ..models.schema import AnalysisResult\n\nclass BaseTask(ABC):\n    \"\"\"\n    すべての解析タスクの基底となる抽象クラス。\n    \"\"\"\n\n    @abstractmethod\n    def run(self, input_data: Any) -> Any:\n        \"\"\"\n        タスクを実行し、解析結果を返す。\n\n        Args:\n            input_data (Any): タスクへの入力データ。\n\n        Returns:\n            Any: 解析結果。\n        \"\"\"\n        pass\n\n    def render(self, result: Any) -> None:\n        \"\"\"\n        解析結果をStreamlit UIにレンダリングします。\n        デフォルトでは結果をコードブロックとして表示します。\n        \"\"\"\n        import streamlit as st\n        st.write(\"### 解析結果\")\n        st.code(str(result))\n";

      const fastaParserCode = "from io import StringIO\nfrom Bio import SeqIO\nfrom ...models.schema import SequenceRecord, AnalysisResult\nfrom ..base import BaseTask\n\nclass FastaParserTask(BaseTask):\n    \"\"\"\n    BioPythonを使用してFASTA形式のデータをパースするタスク。\n    \"\"\"\n\n    def run(self, fasta_content: str) -> AnalysisResult:\n        \"\"\"\n        FASTA文字列をパースし、SequenceRecordのリストを含むAnalysisResultを返す。\n\n        Args:\n            fasta_content (str): FASTA形式の文字列データ。\n\n        Returns:\n            AnalysisResult: パースされたレコードを含む結果。\n        \"\"\"\n        records = []\n        warnings: list[str] = []\n\n        if not fasta_content.strip():\n            return AnalysisResult(records=records, metadata={\"warnings\": warnings})\n\n        first_non_empty_line = next((line for line in fasta_content.splitlines() if line.strip()), \"\")\n        if first_non_empty_line and not first_non_empty_line.startswith(\">\"):\n            warnings.append(\"FASTAヘッダ(`>`)から始まっていないため、入力形式が不正の可能性があります。\")\n\n        # StringIOを使用して文字列をファイルライクオブジェクトとして扱う\n        fasta_io = StringIO(fasta_content)\n\n        try:\n            for record in SeqIO.parse(fasta_io, \"fasta\"):\n                records.append(SequenceRecord(\n                    id=str(record.id),\n                    description=str(record.description),\n                    sequence=str(record.seq),\n                    length=len(record.seq)\n                ))\n        except ValueError as error:\n            warnings.append(f\"FASTAのパース中に警告が発生しました: {error}\")\n\n        return AnalysisResult(records=records, metadata={\"warnings\": warnings})\n";

      const sequenceAnalyzerCode = "from Bio.SeqUtils import gc_fraction\nfrom ...models.schema import SequenceRecord, AnalysisResult\nfrom ..base import BaseTask\n\nclass SequenceAnalysisTask(BaseTask):\n    \"\"\"\n    BioPythonを使用して配列の統計情報（GC含有量、塩基組成など）を計算するタスク。\n    \"\"\"\n\n    def run(self, records: list[SequenceRecord]) -> AnalysisResult:\n        \"\"\"\n        SequenceRecordのリストを受け取り、各レコードの統計情報を計算して更新する。\n\n        Args:\n            records (list[SequenceRecord]): 解析対象のレコードリスト。\n\n        Returns:\n            AnalysisResult: 統計情報が更新されたレコードを含む結果。\n        \"\"\"\n        for record in records:\n            # GC含有量の計算\n            record.gc_content = gc_fraction(record.sequence) * 100\n            \n            # 塩基組成の計算（1回走査で効率的に集計）\n            composition: dict[str, int] = {}\n            for base in record.sequence.upper():\n                if base.isalpha():\n                    composition[base] = composition.get(base, 0) + 1\n            record.base_composition = composition\n            \n        return AnalysisResult(records=records)\n\n    def render(self, result: AnalysisResult) -> None:\n        \"\"\"\n        解析結果を表示します。\n        \"\"\"\n        from ...ui.components import display_sequence_stats\n        display_sequence_stats(result.records)\n";

      const statsCode = "import pandas as pd\nfrom io import StringIO\nfrom typing import Optional\n\ndef calculate_rbh(forward_tsv: str, reverse_tsv: str) -> pd.DataFrame:\n    \"\"\"\n    2つのBLAST結果（TSV形式）から、レシプロカルベストヒット（RBH）を計算します。\n\n    Args:\n        forward_tsv (str): クエリAからデータベースBへのBLAST結果。\n        reverse_tsv (str): クエリBからデータベースAへのBLAST結果。\n\n    Returns:\n        pd.DataFrame: RBHペアのデータフレーム。\n    \"\"\"\n    # BLAST outfmt 6 のカラム名\n    columns = [\n        \"query\", \"subject\", \"identity\", \"alignment_length\", \"mismatches\", \n        \"gap_opens\", \"q_start\", \"q_end\", \"s_start\", \"s_end\", \"evalue\", \"bitscore\"\n    ]\n\n    def get_best_hits(tsv_content: str) -> pd.DataFrame:\n        if not tsv_content.strip():\n            return pd.DataFrame(columns=columns)\n        \n        df = pd.read_csv(StringIO(tsv_content), sep=\"\\t\", names=columns)\n        # 各クエリに対して最大の bitscore を持つヒットを抽出\n        # 同点時は evalue が最小（最良）のものを優先する\n        best_hits = df.sort_values([\"bitscore\", \"evalue\"], ascending=[False, True]).drop_duplicates(\"query\")\n        return best_hits\n\n    df_ab = get_best_hits(forward_tsv)\n    df_ba = get_best_hits(reverse_tsv)\n\n    if df_ab.empty or df_ba.empty:\n        return pd.DataFrame(columns=[\"query_a\", \"query_b\", \"identity_a_to_b\", \"identity_b_to_a\", \"bitscore_a_to_b\", \"bitscore_b_to_a\"])\n\n    # RBHの条件: AのベストヒットがBであり、かつBのベストヒットがAであること\n    # df_ab: query=A_id, subject=B_id\n    # df_ba: query=B_id, subject=A_id\n    \n    # 内部結合で一致するペアを探す\n    rbh = pd.merge(\n        df_ab, \n        df_ba, \n        left_on=[\"query\", \"subject\"], \n        right_on=[\"subject\", \"query\"],\n        suffixes=(\"_fwd\", \"_rev\")\n    )\n\n    # 必要なカラムのみ抽出して整理\n    result = rbh[[\n        \"query_fwd\", \"subject_fwd\", \"identity_fwd\", \"identity_rev\", \"bitscore_fwd\", \"bitscore_rev\"\n    ]].rename(columns={\n        \"query_fwd\": \"query_a\",\n        \"subject_fwd\": \"query_b\",\n        \"identity_fwd\": \"identity_a_to_b\",\n        \"identity_rev\": \"identity_b_to_a\",\n        \"bitscore_fwd\": \"bitscore_a_to_b\",\n        \"bitscore_rev\": \"bitscore_b_to_a\"\n    })\n\n    return result\n\ndef get_identity_stats(rbh_df: pd.DataFrame) -> dict:\n    \"\"\"\n    RBHの結果からIdentityの統計情報を取得します。\n    \n    Args:\n        rbh_df (pd.DataFrame): calculate_rbh で取得したデータフレーム。\n        \n    Returns:\n        dict: 平均、中央値、カウントなどの統計。\n    \"\"\"\n    if rbh_df.empty:\n        return {\"count\": 0, \"mean\": 0.0, \"median\": 0.0}\n    \n    # identity_a_to_b を統計の対象とする\n    stats = {\n        \"count\": len(rbh_df),\n        \"mean\": float(rbh_df[\"identity_a_to_b\"].mean()),\n        \"median\": float(rbh_df[\"identity_a_to_b\"].median()),\n        \"min\": float(rbh_df[\"identity_a_to_b\"].min()),\n        \"max\": float(rbh_df[\"identity_a_to_b\"].max()),\n    }\n    return stats\n";

      const biowasmBridgeCode = "import json\nfrom typing import Any\n\ntry:\n    import js  # type: ignore\nexcept ImportError:\n    js = None  # type: ignore[assignment]\n\ntry:\n    from pyodide.ffi import to_js  # type: ignore\nexcept ImportError:\n    def to_js(value: Any) -> Any:\n        \"\"\"Pyodide 非依存環境向けのフォールバック。\"\"\"\n        return value\n\nclass BiowasmBridge:\n    \"\"\"\n    JavaScript側のAioliライブラリを介してWasmバイオ情報学ツールを呼び出すためのブリッジ。\n    \"\"\"\n\n    def __init__(self):\n        self.initialized = js is not None\n        self._vfs_fallback_notified = False\n\n    def _can_use_js_vfs(self) -> bool:\n        \"\"\"JavaScript 側の VFS API が利用可能か判定する。\"\"\"\n        if js is None:\n            return False\n        return hasattr(js, \"FS\") and hasattr(js.FS, \"writeFile\")\n\n    @staticmethod\n    def is_available() -> bool:\n        \"\"\"Wasm ブリッジが利用可能かどうかを返す。\"\"\"\n        return js is not None\n\n    @staticmethod\n    def supports_runtime_stack_switching() -> bool:\n        \"\"\"現在の JavaScript ランタイムが stack switching をサポートするか判定する。\"\"\"\n        if js is None:\n            return False\n        try:\n            return bool(js.eval(\"typeof WebAssembly === 'object' && typeof WebAssembly.Suspending === 'function'\"))\n        except Exception:\n            return False\n\n    @staticmethod\n    def unavailable_message() -> str:\n        \"\"\"Wasm 未対応環境で表示するメッセージを返す。\"\"\"\n        return (\n            \"この実行環境では Wasm ツールを利用できません。\"\n            \"開発環境の Streamlit 実行では `import js` が利用不可なため、\"\n            \"Wasm 機能（seqtk など）は無効です。\"\n            \"ブラウザ版（index.html / stlite）で実行してください。\"\n        )\n\n    @staticmethod\n    def _quote_cli_arg(value: str) -> str:\n        escaped = value.replace(\"\\\\\", \"\\\\\\\\\").replace('\"', '\\\\\"')\n        return f'\"{escaped}\"'\n\n    @staticmethod\n    def _format_tool_success_data(data: Any) -> str:\n        \"\"\"Wasm ツールの成功レスポンスを文字列へ正規化する。\"\"\"\n        if isinstance(data, dict):\n            stdout = str(data.get(\"stdout\") or \"\")\n            stderr = str(data.get(\"stderr\") or \"\")\n            exit_code = data.get(\"exitCode\", data.get(\"code\"))\n\n            if exit_code not in (None, 0):\n                message = stderr or stdout or str(data)\n                return f\"Wasm実行エラー: {message}\"\n\n            return stdout or stderr or json.dumps(data, ensure_ascii=False)\n\n        return str(data)\n\n    def start_tool_job(self, tool: str, args: str, files: dict[str, str] | None = None) -> str:\n        \"\"\"Wasm ツール実行ジョブを開始し、ジョブIDを返す。\"\"\"\n        if not self.is_available():\n            return f\"ERROR:{self.unavailable_message()}\"\n\n        tool_js = json.dumps(tool, ensure_ascii=False)\n        args_js = json.dumps(args, ensure_ascii=False)\n        files_js = json.dumps(files or {}, ensure_ascii=False)\n        legacy_upload_js = \"true\" if (not files and \"input.fasta\" in args) else \"false\"\n\n        js_code = f\"\"\"\n        (() => {{\n            if (!globalThis._pyowasm_jobs) globalThis._pyowasm_jobs = {{}};\n            const jobId = `job_${{Date.now()}}_${{Math.random().toString(36).slice(2)}}`;\n            globalThis._pyowasm_jobs[jobId] = {{ status: \"running\", debug: [] }};\n\n            (async () => {{\n                const debugLogs = [];\n                const log = (...items) => {{\n                    const line = items\n                        .map((item) => {{\n                            if (typeof item === \"string\") return item;\n                            try {{\n                                return JSON.stringify(item);\n                            }} catch (_e) {{\n                                return String(item);\n                            }}\n                        }})\n                        .join(\" \");\n                    debugLogs.push(line);\n                    try {{\n                        console.log(\"[Pyowasm][debug]\", ...items);\n                    }} catch (_e) {{}}\n                }};\n\n                try {{\n                    const toolName = {tool_js};\n                    const rawArgs = {args_js};\n                    const filesObj = {files_js};\n\n                    log(\"start\", {{ tool: toolName, args: rawArgs }});\n\n                    if (typeof Aioli === 'undefined') {{\n                        const module = await import('https://biowasm.com/cdn/v3/aioli.js');\n                        if (module.default) {{\n                            globalThis.Aioli = module.default;\n                        }}\n                    }}\n\n                    if (typeof globalThis.Aioli !== 'function') {{\n                         throw new Error(\"Aioli could not be loaded as a constructor.\");\n                    }}\n\n                    if (!globalThis._pyowasm_clis) globalThis._pyowasm_clis = {{}};\n                    if (!globalThis._pyowasm_clis[toolName]) {{\n                        globalThis._pyowasm_clis[toolName] = await new Aioli([toolName]);\n                    }}\n                    const cli = globalThis._pyowasm_clis[toolName];\n\n                    let commandToExec = rawArgs;\n                    const filesToMount = [];\n\n                    for (const [name, content] of Object.entries(filesObj)) {{\n                        filesToMount.push({{\n                            name: name,\n                            data: new Blob([new TextEncoder().encode(content)])\n                        }});\n                    }}\n\n                    if ({legacy_upload_js} && !filesToMount.some(f => f.name === \"input.fasta\")) {{\n                        const uploadText = globalThis._pyowasm_upload_text;\n                        if (typeof uploadText === \"string\") {{\n                            filesToMount.push({{\n                                name: \"input.fasta\",\n                                data: new Blob([new TextEncoder().encode(uploadText)])\n                            }});\n                        }}\n                    }}\n\n                    if (filesToMount.length > 0) {{\n                        const mountedPaths = await cli.mount(filesToMount);\n\n                        const resolvePath = (val) => {{\n                            if (!val) return null;\n                            if (typeof val === \"string\") return val;\n                            return val.path || val.mountPath || val.file || val.name || null;\n                        }};\n\n                        const tokenizeCommand = (command) => {{\n                            const matches = command.match(/[^\\\\s\"']+|\"(?:\\\\\\\\.|[^\"])*\"|'(?:\\\\\\\\.|[^'])*'/g);\n                            return matches || [];\n                        }};\n\n                        const normalizeToken = (token) => {{\n                            if (token.length >= 2 && token[0] === '\"' && token[token.length - 1] === '\"') {{\n                                return token.slice(1, -1).replace(/\\\\\\\\\"/g, '\"');\n                            }}\n                            if (token.length >= 2 && token[0] === \"'\" && token[token.length - 1] === \"'\") {{\n                                return token.slice(1, -1).replace(/\\\\\\\\'/g, \"'\");\n                            }}\n                            return token;\n                        }};\n\n                        const formatPathToken = (path) => (/\\\\s/.test(path) ? JSON.stringify(path) : path);\n\n                        let commandTokens = tokenizeCommand(commandToExec);\n                        for (let i = 0; i < filesToMount.length; i++) {{\n                            const originalName = filesToMount[i].name;\n                            const mountedPath = resolvePath(mountedPaths[i]);\n                            if (mountedPath) {{\n                                commandTokens = commandTokens.map((token) =>\n                                    normalizeToken(token) === originalName ? formatPathToken(mountedPath) : token\n                                );\n                            }}\n                        }}\n                        commandToExec = commandTokens.join(\" \");\n                    }}\n\n                    const result = await cli.exec(commandToExec);\n                    globalThis._pyowasm_jobs[jobId] = {{\n                        status: \"success\",\n                        data: result,\n                        debug: debugLogs,\n                    }};\n                }} catch (e) {{\n                    globalThis._pyowasm_jobs[jobId] = {{\n                        status: \"error\",\n                        message: e?.message || String(e),\n                        debug: debugLogs,\n                    }};\n                }}\n            }})();\n\n            return jobId;\n        }})()\n        \"\"\"\n\n        try:\n            return str(js.eval(js_code))\n        except Exception as error:\n            return f\"ERROR:ジョブ開始に失敗しました: {error}\"\n\n    def get_tool_job_result(self, job_id: str) -> dict[str, str]:\n        \"\"\"ジョブ状態を取得し、表示可能な結果へ整形して返す。\"\"\"\n        if not self.is_available():\n            return {\"status\": \"error\", \"result\": self.unavailable_message()}\n\n        job_id_js = json.dumps(job_id, ensure_ascii=False)\n        js_code = f\"\"\"\n        (() => {{\n            const job = globalThis._pyowasm_jobs?.[{job_id_js}];\n            if (!job) {{\n                return JSON.stringify({{ status: \"missing\" }});\n            }}\n            return JSON.stringify(job);\n        }})()\n        \"\"\"\n\n        try:\n            raw = str(js.eval(js_code))\n            payload = json.loads(raw)\n        except Exception as error:\n            return {\"status\": \"error\", \"result\": f\"ジョブ状態取得に失敗しました: {error}\"}\n\n        status = payload.get(\"status\", \"missing\")\n        debug_logs = payload.get(\"debug\") or []\n        trace = \"\\n\".join(f\"[JS] {line}\" for line in debug_logs)\n\n        if status == \"running\":\n            return {\"status\": \"running\", \"result\": \"実行中\"}\n\n        if status == \"success\":\n            data = payload.get(\"data\")\n            result = self._format_tool_success_data(data)\n            if \"Wasm実行エラー:\" in result and trace:\n                result = f\"{result}\\n\\n--- Debug Trace ---\\n{trace}\"\n            return {\"status\": \"success\", \"result\": result}\n\n        if status == \"error\":\n            message = str(payload.get(\"message\") or \"unknown error\")\n            result = f\"Wasm実行エラー: {message}\"\n            if trace:\n                result = f\"{result}\\n\\n--- Debug Trace ---\\n{trace}\"\n            return {\"status\": \"error\", \"result\": result}\n\n        return {\"status\": \"missing\", \"result\": \"ジョブが見つかりません。\"}\n\n    def clear_tool_job(self, job_id: str) -> None:\n        \"\"\"完了したジョブ情報を削除する。\"\"\"\n        if not self.is_available():\n            return\n\n        job_id_js = json.dumps(job_id, ensure_ascii=False)\n        js_code = f\"\"\"\n        (() => {{\n            if (globalThis._pyowasm_jobs) {{\n                delete globalThis._pyowasm_jobs[{job_id_js}];\n            }}\n        }})()\n        \"\"\"\n        try:\n            js.eval(js_code)\n        except Exception:\n            return\n\n    async def run_tool(self, tool: str, args: str, files: dict[str, str] = None) -> str:\n        \"\"\"\n        Wasmツールを実行します。\n        files: { \"filename\": \"content\" } の辞書。Aioliにマウントされます。\n        \"\"\"\n        if not self.is_available():\n            return self.unavailable_message()\n\n        py_debug = [\n            f\"[PY] tool={tool}\",\n            f\"[PY] args={args}\",\n        ]\n\n        # JSに渡すためのファイルデータを一時的にグローバルに配置（eval内で参照するため）\n        if files:\n            js._pyowasm_files = to_js(files)\n        else:\n            js._pyowasm_files = None\n\n        try:\n            # 入力ファイルの有無を判定\n            use_legacy_upload = (not files) and (\"input.fasta\" in args)\n            py_debug.append(f\"[PY] has_files={bool(files) or use_legacy_upload}\")\n\n            # f-string でJSコードを組み立てる際の注入/構文崩れを防ぐため、\n            # 外部入力は JSON 文字列リテラルとして埋め込む。\n            tool_js = json.dumps(tool, ensure_ascii=False)\n            args_js = json.dumps(args, ensure_ascii=False)\n            legacy_upload_js = \"true\" if use_legacy_upload else \"false\"\n\n            js_code = f\"\"\"\n            (async () => {{\n                const debugLogs = [];\n                const log = (...items) => {{\n                    const line = items\n                        .map((item) => {{\n                            if (typeof item === \"string\") return item;\n                            try {{\n                                return JSON.stringify(item);\n                            }} catch (_e) {{\n                                return String(item);\n                            }}\n                        }})\n                        .join(\" \");\n                    debugLogs.push(line);\n                    try {{\n                        console.log(\"[Pyowasm][debug]\", ...items);\n                    }} catch (_e) {{}}\n                }};\n\n                try {{\n                    const toolName = {tool_js};\n                    const rawArgs = {args_js};\n\n                    log(\"start\", {{ tool: toolName, args: rawArgs }});\n\n                    // 1. Aioli ロード\n                    if (typeof Aioli === 'undefined') {{\n                        log(\"Aioli not found, trying dynamic import\");\n                        try {{\n                            const module = await import('https://biowasm.com/cdn/v3/aioli.js');\n                            if (module.default) {{\n                                globalThis.Aioli = module.default;\n                                log(\"Aioli resolved from module.default\");\n                            }} else if (typeof globalThis.Aioli === 'undefined') {{\n                                for (const key in module) {{\n                                    if (typeof module[key] === 'function') {{\n                                        globalThis.Aioli = module[key];\n                                        log(\"Aioli resolved from module key\", key);\n                                        break;\n                                    }}\n                                }}\n                            }}\n                        }} catch (e) {{\n                            log(\"dynamic import failed\", e?.message || String(e));\n                        }}\n                    }}\n\n                    if (typeof globalThis.Aioli !== 'function') {{\n                         throw new Error(\"Aioli could not be loaded as a constructor.\");\n                    }}\n\n                    // 2. 初期化\n                    if (!globalThis._pyowasm_clis) globalThis._pyowasm_clis = {{}};\n                    if (!globalThis._pyowasm_clis[toolName]) {{\n                        log(\"creating new Aioli instance\", toolName);\n                        globalThis._pyowasm_clis[toolName] = await new Aioli([toolName]);\n                    }}\n                    const cli = globalThis._pyowasm_clis[toolName];\n                    log(\"cli ready\", !!cli);\n\n                    // 3. マウント処理\n                    let commandToExec = rawArgs;\n                    const filesToMount = [];\n                    const jsFiles = globalThis._pyowasm_files;\n\n                    if (jsFiles && typeof jsFiles.entries === \"function\") {{\n                        for (const [name, content] of jsFiles.entries()) {{\n                            filesToMount.push({{\n                                name: name,\n                                data: new Blob([new TextEncoder().encode(content)])\n                            }});\n                        }}\n                    }}\n\n                    // レガシー互換: _pyowasm_upload_text を使用\n                    if ({legacy_upload_js} && !filesToMount.some(f => f.name === \"input.fasta\")) {{\n                        const uploadText = globalThis._pyowasm_upload_text;\n                        if (typeof uploadText === \"string\") {{\n                            filesToMount.push({{\n                                name: \"input.fasta\",\n                                data: new Blob([new TextEncoder().encode(uploadText)])\n                            }});\n                        }}\n                    }}\n\n                    if (filesToMount.length > 0) {{\n                        log(\"mounting files\", filesToMount.map(f => f.name));\n                        const mountedPaths = await cli.mount(filesToMount);\n                        log(\"mountedPaths\", mountedPaths);\n\n                        const resolvePath = (val) => {{\n                            if (!val) return null;\n                            if (typeof val === \"string\") return val;\n                            return val.path || val.mountPath || val.file || val.name || null;\n                        }};\n\n                        const tokenizeCommand = (command) => {{\n                            const matches = command.match(/[^\\\\s\"']+|\"(?:\\\\\\\\.|[^\"])*\"|'(?:\\\\\\\\.|[^'])*'/g);\n                            return matches || [];\n                        }};\n\n                        const normalizeToken = (token) => {{\n                            if (token.length >= 2 && token[0] === '\"' && token[token.length - 1] === '\"') {{\n                                return token.slice(1, -1).replace(/\\\\\\\\\"/g, '\"');\n                            }}\n                            if (token.length >= 2 && token[0] === \"'\" && token[token.length - 1] === \"'\") {{\n                                return token.slice(1, -1).replace(/\\\\\\\\'/g, \"'\");\n                            }}\n                            return token;\n                        }};\n\n                        const formatPathToken = (path) => {{\n                            if (/\\\\s/.test(path)) {{\n                                return JSON.stringify(path);\n                            }}\n                            return path;\n                        }};\n\n                        let commandTokens = tokenizeCommand(commandToExec);\n\n                        for (let i = 0; i < filesToMount.length; i++) {{\n                            const originalName = filesToMount[i].name;\n                            const mountedPath = resolvePath(mountedPaths[i]);\n                            if (mountedPath) {{\n                                commandTokens = commandTokens.map((token) =>\n                                    normalizeToken(token) === originalName ? formatPathToken(mountedPath) : token\n                                );\n                            }}\n                        }}\n                        commandToExec = commandTokens.join(\" \");\n                        log(\"finalCommand\", commandToExec);\n                    }}\n\n                    log(\"executing\", commandToExec);\n                    const result = await cli.exec(commandToExec);\n                    log(\"exec completed\");\n                    return JSON.stringify({{ status: \"success\", data: result, debug: debugLogs }});\n\n                }} catch (e) {{\n                    log(\"bridgeError\", e?.message || String(e));\n                    return JSON.stringify({{ status: \"error\", message: e.message || String(e), debug: debugLogs }});\n                }} finally {{\n                    // 一時変数のクリア\n                    delete globalThis._pyowasm_files;\n                }}\n            }})()\n            \"\"\"\n            \n            js_response_json = await js.eval(js_code)\n            py_debug.append(f\"[PY] js_response_json={js_response_json}\")\n            response = json.loads(js_response_json)\n            js_debug = response.get(\"debug\") or []\n            trace = \"\\n\".join(py_debug + [f\"[JS] {line}\" for line in js_debug])\n            \n            if response[\"status\"] == \"success\":\n                data = response.get(\"data\")\n                if isinstance(data, dict):\n                    stdout = str(data.get(\"stdout\") or \"\")\n                    stderr = str(data.get(\"stderr\") or \"\")\n                    exit_code = data.get(\"exitCode\", data.get(\"code\"))\n\n                    if exit_code not in (None, 0):\n                        message = stderr or stdout or str(data)\n                        return f\"Wasm実行エラー: {message}\\n\\n--- Debug Trace ---\\n{trace}\"\n                    return stdout or stderr or json.dumps(data, ensure_ascii=False)\n\n                return str(data)\n            else:\n                return f\"Wasm実行エラー: {response['message']}\\n\\n--- Debug Trace ---\\n{trace}\"\n            \n        except Exception as e:\n            py_debug.append(f\"[PY] exception={str(e)}\")\n            trace = \"\\n\".join(py_debug)\n            return f\"ブリッジ通信エラー: {str(e)}\\n\\n--- Debug Trace ---\\n{trace}\"\n\n    async def smith_waterman(self, query_sequence: str, subject_sequence: str) -> str:\n        \"\"\"\n        seq-align の smith_waterman を実行します。\n        2 配列を直接引数で渡し、アラインメント結果のテキストを返します。\n        \"\"\"\n        command = (\n            f\"smith_waterman {self._quote_cli_arg(query_sequence)} \"\n            f\"{self._quote_cli_arg(subject_sequence)}\"\n        )\n        return await self.run_tool(\"seq-align/smith_waterman/2017.10.18\", command)\n\n    async def seqtk(self, command: str, files: dict[str, str] = None) -> str:\n        \"\"\"\n        seqtkを実行します。\n        \"\"\"\n        full_command = command.strip()\n        if not full_command.startswith(\"seqtk\"):\n            full_command = f\"seqtk {full_command}\"\n        return await self.run_tool(\"seqtk/1.3\", full_command, files=files)\n\n    def write_to_vfs(self, filename: str, content: str) -> str:\n        \"\"\"\n        Python側の文字列データをEmscriptenの仮想FSに書き出します。\n        \"\"\"\n        if not self.is_available():\n            import os\n\n            os.makedirs(os.path.dirname(filename) if os.path.dirname(filename) else \".\", exist_ok=True)\n            with open(filename, \"w\", encoding=\"utf-8\") as file_handle:\n                file_handle.write(content)\n            return filename\n\n        if not self._can_use_js_vfs():\n            js._pyowasm_upload_text = content\n            if not self._vfs_fallback_notified:\n                try:\n                    js.console.warn(\"[Pyowasm] JS VFS (FS.writeFile) が未対応のため、Python側フォールバックを使用します。\")\n                except Exception:\n                    pass\n                self._vfs_fallback_notified = True\n\n            import os\n            os.makedirs(os.path.dirname(filename) if os.path.dirname(filename) else \".\", exist_ok=True)\n            with open(filename, \"w\", encoding=\"utf-8\") as file_handle:\n                file_handle.write(content)\n            return filename\n\n        try:\n            js.FS.writeFile(filename, content)\n            js._pyowasm_upload_text = content\n            js.console.log(f\"[Pyowasm] File written to VFS: {filename} ({len(content)} bytes)\")\n            return filename\n        except Exception as e:\n            try:\n                js.console.warn(f\"[Pyowasm] VFS書き込みに失敗したためフォールバックします: {str(e)}\")\n            except Exception:\n                pass\n            js._pyowasm_upload_text = content\n            import os\n            os.makedirs(os.path.dirname(filename) if os.path.dirname(filename) else \".\", exist_ok=True)\n            with open(filename, \"w\", encoding=\"utf-8\") as f:\n                f.write(content)\n            return filename\n\nbridge = BiowasmBridge()\n";

      const seqtkTaskCode = "import streamlit as st\nfrom typing import Any, Optional\nfrom ..base import BaseTask\nfrom ...bridge.biowasm import bridge\n\nclass SeqtkTask(BaseTask):\n    \"\"\"\n    Wasm版 seqtk を使用して配列処理を行うタスク。\n    \"\"\"\n\n    def run(self, input_data: Any) -> str:\n        \"\"\"\n        BaseTask 互換の実行入口。\n\n        既存のUI実装は start/poll を使用するが、\n        抽象基底クラス要件を満たすため run を提供する。\n        \"\"\"\n        if not isinstance(input_data, dict):\n            return \"Wasm実行エラー: 入力形式が不正です。\"\n\n        input_filename = str(input_data.get(\"input_filename\", \"input.fasta\"))\n        command = str(input_data.get(\"command\", \"seq -a\"))\n        input_content_raw = input_data.get(\"input_content\")\n        input_content = str(input_content_raw) if input_content_raw is not None else None\n\n        return self.start(\n            input_filename=input_filename,\n            command=command,\n            input_content=input_content,\n        )\n\n    def start(\n        self,\n        input_filename: str,\n        command: str = \"seq -a\",\n        input_content: Optional[str] = None,\n    ) -> str:\n        \"\"\"\n        seqtk の実行ジョブを開始し、ジョブIDを返す。\n        \"\"\"\n        full_command = command.strip()\n        if input_filename not in full_command.split():\n            full_command = f\"{full_command} {input_filename}\"\n\n        files = None\n        if input_content is not None:\n            files = {input_filename: input_content}\n\n        return bridge.start_tool_job(\"seqtk/1.3\", f\"seqtk {full_command}\" if not full_command.startswith(\"seqtk\") else full_command, files=files)\n\n    def poll(self, job_id: str) -> dict[str, str]:\n        \"\"\"実行中ジョブの状態を取得する。\"\"\"\n        return bridge.get_tool_job_result(job_id)\n\n    def cleanup(self, job_id: str) -> None:\n        \"\"\"完了したジョブをクリーンアップする。\"\"\"\n        bridge.clear_tool_job(job_id)\n\n    def render(self, result: str) -> None:\n        \"\"\"\n        seqtkの実行結果を表示します。\n        \"\"\"\n        st.write(\"### Seqtk 出力\")\n        if (\n            result.startswith(\"Wasm実行エラー:\")\n            or result.startswith(\"ブリッジ通信エラー:\")\n            or \"Wasm ツールを利用できません\" in result\n        ):\n            st.error(\"Wasm(seqtk) 実行でエラーが発生しました。\")\n            if \"--- Debug Trace ---\" in result:\n                message, trace = result.split(\"--- Debug Trace ---\", 1)\n                st.code(message.strip())\n                with st.expander(\"デバッグトレースを表示\", expanded=True):\n                    st.code(trace.strip())\n            else:\n                st.code(result)\n            return\n\n        st.success(\"Wasm(seqtk) での処理が完了しました。\")\n        st.code(result)\n";

      const orthologAnalyzerCode = "import pandas as pd\nimport re\nfrom collections import defaultdict\nfrom io import StringIO\nfrom Bio import SeqIO\nfrom Bio.Seq import Seq\nfrom Bio.SeqRecord import SeqRecord\nfrom Bio.Align import PairwiseAligner, substitution_matrices\nfrom ..base import BaseTask\n\nALLOWED_AMINO_ACIDS = set(substitution_matrices.load(\"BLOSUM62\").alphabet)\n\nclass OrthologAnalysisTask(BaseTask):\n    \"\"\"\n    k-mer 候補絞り込み + BioPython PairwiseAligner を使用して 2 種間のオーソログ解析（RBH）を行うタスク。\n    \"\"\"\n\n    def __init__(self) -> None:\n        \"\"\"直近の入力検証結果を保持する。\"\"\"\n        self.last_warnings: list[str] = []\n        self.last_excluded_records: list[dict[str, object]] = []\n\n    @staticmethod\n    def _normalize_fasta_content(fasta_content: str) -> str:\n        \"\"\"FASTA 文字列全体から BOM と行末空白を除去する。\"\"\"\n        cleaned = fasta_content.replace(\"\\ufeff\", \"\")\n        return \"\\n\".join(line.rstrip() for line in cleaned.splitlines())\n\n    @staticmethod\n    def _normalize_sequence(sequence: str) -> str:\n        \"\"\"配列文字列をアラインメント前に正規化する。\"\"\"\n        return sequence.replace(\"\\ufeff\", \"\").strip().upper()\n\n    def _sanitize_sequences(self, records: list[SeqRecord], species_label: str) -> list[SeqRecord]:\n        \"\"\"配列を正規化し、BLOSUM62 非対応文字を含むレコードを除外する。\"\"\"\n        sanitized_records: list[SeqRecord] = []\n\n        for record in records:\n            normalized = self._normalize_sequence(str(record.seq))\n            invalid_chars = sorted(set(normalized) - ALLOWED_AMINO_ACIDS)\n\n            if invalid_chars:\n                self.last_excluded_records.append({\n                    \"species\": species_label,\n                    \"record_id\": record.id,\n                    \"invalid_chars\": \"\".join(invalid_chars),\n                    \"length\": len(normalized),\n                })\n                continue\n\n            sanitized_records.append(\n                SeqRecord(Seq(normalized), id=record.id, description=record.description)\n            )\n\n        return sanitized_records\n\n    @staticmethod\n    def _normalize_text_for_keyword_match(text: str) -> str:\n        \"\"\"キーワード照合用に区切り文字を空白へ寄せて正規化する。\"\"\"\n        normalized = text.replace(\"_\", \" \").replace(\"-\", \" \").lower()\n        return re.sub(r\"\\s+\", \" \", normalized).strip()\n\n    def _filter_records_by_keywords(\n        self,\n        records: list[SeqRecord],\n        species_label: str,\n        keywords: list[str],\n    ) -> list[SeqRecord]:\n        \"\"\"description にキーワードを含むレコードのみ残す。\"\"\"\n        cleaned_keywords = [k.strip() for k in keywords if k and k.strip()]\n        if not cleaned_keywords:\n            return records\n\n        pattern = re.compile(\n            \"|\".join(re.escape(self._normalize_text_for_keyword_match(k)) for k in cleaned_keywords),\n            re.IGNORECASE,\n        )\n\n        selected: list[SeqRecord] = []\n        for record in records:\n            normalized_description = self._normalize_text_for_keyword_match(record.description)\n            if pattern.search(normalized_description):\n                selected.append(record)\n\n        filtered_out = len(records) - len(selected)\n        self.last_warnings.append(\n            f\"{species_label} をキーワード抽出しました（キーワード {len(cleaned_keywords)}件、\"\n            f\"抽出 {len(selected)}件、除外 {filtered_out}件）。\"\n        )\n        return selected\n\n    def _update_validation_summary(self) -> None:\n        \"\"\"除外レコード数に応じた警告メッセージを更新する。\"\"\"\n        if not self.last_excluded_records:\n            return\n\n        counts: dict[str, int] = {}\n        for record in self.last_excluded_records:\n            species = str(record[\"species\"])\n            counts[species] = counts.get(species, 0) + 1\n\n        summary = \"、\".join(f\"{species} {count}件\" for species, count in counts.items())\n        total = len(self.last_excluded_records)\n        self.last_warnings.append(\n            f\"BLOSUM62 非対応文字を含むレコードを除外して続行しました（{summary}、合計 {total}件）。\"\n        )\n\n    @staticmethod\n    def _build_kmer_index(seqs: list[SeqRecord], k: int = 4) -> dict[str, set[str]]:\n        \"\"\"k-mer インデックスを構築する。\n\n        Returns:\n            {kmer文字列: {seq_id, ...}} の辞書\n        \"\"\"\n        index: dict[str, set[str]] = defaultdict(set)\n        for record in seqs:\n            seq = str(record.seq)\n            for i in range(len(seq) - k + 1):\n                index[seq[i:i + k]].add(record.id)\n        return index\n\n    @staticmethod\n    def _get_candidates(\n        query_record: SeqRecord,\n        subject_index: dict[str, set[str]],\n        subject_kmer_sets: dict[str, set[str]],\n        top_n: int = 20,\n        k: int = 4,\n    ) -> list[tuple[str, float]]:\n        \"\"\"クエリに対して Jaccard 類似度上位 top_n の候補 subject ID を返す。\n\n        Returns:\n            [(seq_id, jaccard_score), ...] (降順ソート済み)\n        \"\"\"\n        query_seq = str(query_record.seq)\n        query_kmers = set(query_seq[i:i + k] for i in range(len(query_seq) - k + 1))\n\n        shared_counts: dict[str, int] = {}\n        for kmer in query_kmers:\n            if kmer in subject_index:\n                for sid in subject_index[kmer]:\n                    shared_counts[sid] = shared_counts.get(sid, 0) + 1\n\n        if not shared_counts:\n            return []\n\n        candidates: list[tuple[str, float]] = []\n        for sid, shared in shared_counts.items():\n            subject_kmers = subject_kmer_sets[sid]\n            union = len(query_kmers) + len(subject_kmers) - shared\n            jaccard = shared / union if union > 0 else 0.0\n            candidates.append((sid, jaccard))\n\n        candidates.sort(key=lambda x: x[1], reverse=True)\n        return candidates[:top_n]\n\n    def _compute_best_hits_fast(\n        self,\n        seqs_query: list[SeqRecord],\n        seqs_subject: list[SeqRecord],\n        k: int = 4,\n        top_n: int = 20,\n    ) -> pd.DataFrame:\n        \"\"\"k-mer 候補絞り込み + PairwiseAligner で各クエリの最良ヒットを計算する。\n\n        全組合せ (N×M) ではなく、k-mer Jaccard 類似度上位 top_n 候補のみ\n        精密アラインメントを実施して処理量を削減する。\n        \"\"\"\n        # subject の k-mer インデックスと k-mer 集合を構築\n        subject_index = self._build_kmer_index(seqs_subject, k)\n        subject_dict = {r.id: r for r in seqs_subject}\n        subject_kmer_sets: dict[str, set[str]] = {\n            r.id: set(str(r.seq)[i:i + k] for i in range(len(str(r.seq)) - k + 1))\n            for r in seqs_subject\n        }\n\n        aligner = PairwiseAligner()\n        aligner.substitution_matrix = substitution_matrices.load(\"BLOSUM62\")\n        aligner.open_gap_score = -11\n        aligner.extend_gap_score = -1\n\n        self_scores = {r.id: aligner.score(str(r.seq), str(r.seq)) for r in seqs_query}\n\n        rows: list[dict[str, float | str]] = []\n        total_aligned = 0\n\n        for query_record in seqs_query:\n            candidates = self._get_candidates(\n                query_record, subject_index, subject_kmer_sets, top_n, k\n            )\n\n            # k-mer に共通部分がない場合は全 subject を対象にして精密アラインメント\n            if not candidates:\n                candidates = [(r.id, 0.0) for r in seqs_subject]\n\n            best_score: float | None = None\n            best_sid: str | None = None\n\n            for sid, _ in candidates:\n                s_record = subject_dict[sid]\n                sc = aligner.score(str(query_record.seq), str(s_record.seq))\n                total_aligned += 1\n                if best_score is None or sc > best_score:\n                    best_score = sc\n                    best_sid = sid\n\n            if best_sid is not None and best_score is not None:\n                ss = self_scores[query_record.id]\n                identity = min(best_score / ss * 100, 100.0) if ss > 0 else 0.0\n                rows.append({\n                    \"query\": query_record.id,\n                    \"subject\": best_sid,\n                    \"identity\": identity,\n                    \"bitscore\": float(best_score),\n                })\n\n        total_pairs = len(seqs_query) * len(seqs_subject)\n        self.last_warnings.append(\n            f\"k-mer候補絞り込み完了: {total_aligned:,}ペアのみ精密アラインメントを実施\"\n            f\"（全組合せ {total_pairs:,}ペアから削減、k={k}、top_n={top_n}）\"\n        )\n\n        return pd.DataFrame(rows) if rows else pd.DataFrame(columns=[\"query\", \"subject\", \"identity\", \"bitscore\"])\n\n    def run(\n        self,\n        sample_a: str,\n        sample_b: str,\n        keywords_a: list[str] | None = None,\n        keywords_b: list[str] | None = None,\n        k: int = 4,\n        top_n: int = 20,\n    ) -> pd.DataFrame:\n        \"\"\"k-mer 候補絞り込み + PairwiseAligner で 2 種間の RBH（相互最良ヒット）解析を行う。\"\"\"\n        self.last_warnings = []\n        self.last_excluded_records = []\n        empty = pd.DataFrame(columns=[\"query_a\", \"query_b\", \"identity_a_to_b\", \"identity_b_to_a\", \"bitscore_a_to_b\", \"bitscore_b_to_a\"])\n\n        # FASTA パース\n        normalized_a = self._normalize_fasta_content(sample_a)\n        normalized_b = self._normalize_fasta_content(sample_b)\n        seqs_a = list(SeqIO.parse(StringIO(normalized_a), \"fasta\"))\n        seqs_b = list(SeqIO.parse(StringIO(normalized_b), \"fasta\"))\n\n        if not seqs_a or not seqs_b:\n            return empty\n\n        # キーワード抽出\n        if keywords_a:\n            seqs_a = self._filter_records_by_keywords(seqs_a, \"Species A\", keywords_a)\n        if keywords_b:\n            seqs_b = self._filter_records_by_keywords(seqs_b, \"Species B\", keywords_b)\n\n        if not seqs_a or not seqs_b:\n            return empty\n\n        # 配列正規化\n        seqs_a = self._sanitize_sequences(seqs_a, \"Species A\")\n        seqs_b = self._sanitize_sequences(seqs_b, \"Species B\")\n\n        if not seqs_a or not seqs_b:\n            return empty\n\n        self._update_validation_summary()\n\n        # A→B および B→A の最良ヒットを k-mer + PairwiseAligner で計算\n        df_ab = self._compute_best_hits_fast(seqs_a, seqs_b, k=k, top_n=top_n)\n        df_ba = self._compute_best_hits_fast(seqs_b, seqs_a, k=k, top_n=top_n)\n\n        if df_ab.empty or df_ba.empty:\n            self.last_warnings.append(\"配列検索でヒットが見つかりませんでした。\")\n            return empty\n\n        # RBH（相互最良ヒット）検出\n        rbh = pd.merge(\n            df_ab, df_ba,\n            left_on=[\"query\", \"subject\"],\n            right_on=[\"subject\", \"query\"],\n            suffixes=(\"_fwd\", \"_rev\")\n        )\n\n        if rbh.empty:\n            self.last_warnings.append(\"相互最良ヒット（RBH）が見つかりませんでした。\")\n            return empty\n\n        self.last_warnings.append(\n            f\"✅ RBH解析完了: {len(rbh)}件のオーソログを検出しました（k-mer k={k}、top_n={top_n}）\"\n        )\n\n        return rbh[[\"query_fwd\", \"subject_fwd\", \"identity_fwd\", \"identity_rev\", \"bitscore_fwd\", \"bitscore_rev\"]].rename(columns={\n            \"query_fwd\": \"query_a\",\n            \"subject_fwd\": \"query_b\",\n            \"identity_fwd\": \"identity_a_to_b\",\n            \"identity_rev\": \"identity_b_to_a\",\n            \"bitscore_fwd\": \"bitscore_a_to_b\",\n            \"bitscore_rev\": \"bitscore_b_to_a\",\n        })\n\n";

      const uiComponentsCode = "import streamlit as st\nimport pandas as pd\nimport seaborn as sns\nimport matplotlib.pyplot as plt\nimport asyncio\nfrom typing import List, Dict, Optional\nfrom ..models.schema import SequenceRecord\nfrom ..core.stats import get_identity_stats\n\nMAX_RBH_SCATTER_POINTS = 500\n\n# (render_rbh_plots, render_rbh_results は変更なし)\n\ndef render_rbh_plots(rbh_df: pd.DataFrame) -> None:\n    \"\"\"\n    RBHの結果を可視化するグラフを生成・表示します。\n    \"\"\"\n    if rbh_df.empty:\n        st.warning(\"表示するデータがありません。\")\n        return\n\n    col1, col2 = st.columns(2)\n\n    with col1:\n        st.write(\"### Identity 分布\")\n        fig, ax = plt.subplots()\n        sns.histplot(rbh_df[\"identity_a_to_b\"], bins=20, kde=True, ax=ax, color=\"skyblue\")\n        ax.set_xlabel(\"Identity (%)\")\n        ax.set_ylabel(\"Frequency\")\n        st.pyplot(fig)\n\n    with col2:\n        st.write(\"### ドットプロット (Synteny)\")\n        # インデックスに基づく簡易的なドットプロット\n        # クエリ名をソートして並べることで大まかな傾向を見る\n        plot_df = rbh_df.copy()\n        if len(plot_df) > MAX_RBH_SCATTER_POINTS:\n            plot_df = plot_df.nlargest(MAX_RBH_SCATTER_POINTS, \"bitscore_a_to_b\")\n            st.info(\n                f\"RBH件数が多いため、ドットプロットは bitscore 上位 {MAX_RBH_SCATTER_POINTS} 件のみ表示しています。\"\n            )\n        plot_df = plot_df.sort_values([\"query_a\", \"query_b\"])\n        \n        fig, ax = plt.subplots()\n        sns.scatterplot(\n            data=plot_df, \n            x=\"query_a\", \n            y=\"query_b\", \n            size=\"bitscore_a_to_b\", \n            hue=\"identity_a_to_b\",\n            ax=ax,\n            legend=False,\n            alpha=0.6\n        )\n        ax.set_xticks([]) # ラベルが多いと重なるため非表示\n        ax.set_yticks([])\n        ax.set_xlabel(\"Species A Genes\")\n        ax.set_ylabel(\"Species B Genes\")\n        st.pyplot(fig)\n\ndef render_rbh_results(rbh_df: pd.DataFrame) -> None:\n    \"\"\"\n    RBH解析の結果サマリーとグラフを表示します。\n    \"\"\"\n    st.divider()\n    st.header(\"📊 オーソログ解析結果 (RBH)\")\n\n    stats = get_identity_stats(rbh_df)\n    \n    if stats[\"count\"] == 0:\n        st.warning(\"オーソログが見つかりませんでした。\")\n        return\n\n    col1, col2, col3 = st.columns(3)\n    col1.metric(\"オーソログ数\", stats[\"count\"])\n    col2.metric(\"平均一致率\", f\"{stats['mean']:.1f} %\")\n    col3.metric(\"最高一致率\", f\"{stats['max']:.1f} %\")\n\n    render_rbh_plots(rbh_df)\n\n    with st.expander(\"詳細データ一覧を表示\"):\n        st.dataframe(rbh_df)\n\nasync def render_analysis_mode() -> None:\n    \"\"\"\n    配列統計解析モードのUIを表示します。\n    \"\"\"\n    st.subheader(\"📊 配列統計解析\")\n    st.info(\"BioPythonを使用して、アップロードされたFASTAファイルの基本統計を計算します。\")\n\n    uploaded_file = st.file_uploader(\"FASTAファイルをアップロード\", type=[\"fasta\", \"faa\", \"fastq\"])\n\n    if st.button(\"📊 解析を実行\", use_container_width=True):\n        if uploaded_file:\n            # オーバーレイを表示\n            overlay = st.empty()\n            overlay.markdown(\"<style>#loading-overlay { display: flex !important; }</style>\", unsafe_allow_html=True)\n            \n            # ブラウザに描画させるために一時停止\n            await asyncio.sleep(0.1)\n            \n            from ..tasks.local.fasta_parser import FastaParserTask\n            from ..tasks.local.sequence_analyzer import SequenceAnalysisTask\n            from ..bridge.biowasm import bridge\n\n            with st.status(\"Python (Wasm) で解析中...\", expanded=True) as status:\n                fasta_data = uploaded_file.getvalue().decode(\"utf-8\")\n                bridge.write_to_vfs(\"input.fasta\", fasta_data)\n\n                parser = FastaParserTask()\n                parse_result = parser.run(fasta_data)\n\n                analyzer = SequenceAnalysisTask()\n                analysis_result = analyzer.run(parse_result.records)\n\n                status.update(label=\"解析完了!\", state=\"complete\")\n\n            # 結果を表示し、オーバーレイを消すためにリラン\n            st.session_state[\"analysis_result\"] = analysis_result.records\n            overlay.empty()\n            st.rerun()\n        else:\n            st.warning(\"解析対象のファイルをアップロードしてください。\")\n\n    if \"analysis_result\" in st.session_state:\n        display_sequence_stats(st.session_state[\"analysis_result\"])\n\n\nasync def render_seqtk_mode() -> None:\n    \"\"\"\n    Seqtk実行モードのUIを表示します。\n    \"\"\"\n    st.subheader(\"🔧 Wasmツール (biowasm)\")\n    st.info(\"JS/Wasm ブリッジを介して、ブラウザ内で seqtk を直接実行します。\")\n\n    from ..bridge.biowasm import bridge\n\n    if not bridge.is_available():\n        st.info(bridge.unavailable_message())\n        return\n\n    uploaded_file = st.file_uploader(\"ファイルをアップロード\", type=[\"fasta\", \"fastq\"])\n    vfs_path = \"input.fasta\"\n    input_content = None\n\n    if uploaded_file:\n        input_content = uploaded_file.getvalue().decode(\"utf-8\")\n        bridge.write_to_vfs(vfs_path, input_content)\n\n    await display_biowasm_ui(vfs_path, input_content=input_content)\n\nasync def render_ortholog_mode() -> None:\n    \"\"\"\n    オーソログ解析モードのUIを表示します。\n    \"\"\"\n    st.subheader(\"🧪 オーソログ解析 (RBH)\")\n    st.info(\"Wasm 上で RBH 解析パイプラインを実行します。\")\n\n    keyword_input = st.text_input(\n        \"キーワード抽出用キーワード（カンマ区切り）\",\n        value=\"caffeine synthase, methyltransferase, xanthosine\",\n        help=\"解析対象の配列を絞り込むためのキーワード。カンマ区切りで入力してください。\"\n    )\n    target_keywords = [k.strip() for k in keyword_input.split(\",\") if k.strip()]\n\n    col_k, col_top = st.columns(2)\n\n    with col_k:\n        k_size = st.slider(\n            \"k-mer サイズ (k)\",\n            min_value=3, max_value=6, value=4,\n            help=\"アミノ酸 k-mer のサイズ。大きいほど精度↑・ヒット率↓。\",\n        )\n    with col_top:\n        top_n = st.slider(\n            \"候補数 (top_n)\",\n            min_value=5, max_value=100, value=20,\n            help=\"k-mer スコア上位何件に精密アラインメントを実施するか。\",\n        )\n\n    st.write(\"### FAA ファイルをアップロード\")\n    col1, col2 = st.columns(2)\n    data_a, data_b = \"\", \"\"\n    with col1:\n        file_a = st.file_uploader(\"Species A の FAA ファイル\", type=[\"faa\", \"fasta\"])\n        if file_a:\n            data_a = file_a.getvalue().decode(\"utf-8\")\n    with col2:\n        file_b = st.file_uploader(\"Species B の FAA ファイル\", type=[\"faa\", \"fasta\"])\n        if file_b:\n            data_b = file_b.getvalue().decode(\"utf-8\")\n\n    if st.button(\"🚀 RBHパイプラインを実行\", use_container_width=True):\n        if data_a and data_b:\n            # オーバーレイを表示\n            overlay = st.empty()\n            overlay.markdown(\"<style>#loading-overlay { display: flex !important; }</style>\", unsafe_allow_html=True)\n\n            # ブラウザに描画させるために一時停止\n            await asyncio.sleep(0.1)\n\n            from ..tasks.wasm.ortholog_analyzer import OrthologAnalysisTask\n            task = OrthologAnalysisTask()\n            try:\n                with st.status(\"RBH解析実行中...\", expanded=True) as status:\n                    result = task.run(\n                        data_a,\n                        data_b,\n                        keywords_a=target_keywords,\n                        keywords_b=target_keywords,\n                        k=k_size,\n                        top_n=top_n,\n                    )\n                    status.update(label=\"解析完了!\", state=\"complete\")\n                \n                # 結果を保持（リランで消えないように）\n                st.session_state[\"ortholog_result\"] = result\n                st.session_state[\"ortholog_warnings\"] = task.last_warnings\n                st.session_state[\"ortholog_excluded\"] = task.last_excluded_records\n                \n                # オーバーレイを消すためにリラン\n                overlay.empty()\n                st.rerun()\n            except Exception as e:\n                st.error(f\"RBH解析でエラーが発生しました: {e}\")\n        else:\n            st.warning(\"両方の入力データが必要です。\")\n\n    if \"ortholog_result\" in st.session_state:\n        for warning_message in st.session_state.get(\"ortholog_warnings\", []):\n            st.warning(warning_message)\n        if st.session_state.get(\"ortholog_excluded\"):\n            with st.expander(\"除外したレコード一覧を表示\"):\n                st.dataframe(pd.DataFrame(st.session_state[\"ortholog_excluded\"]))\n        render_rbh_results(st.session_state[\"ortholog_result\"])\n\ndef display_sequence_stats(records: List[SequenceRecord]) -> None:\n    \"\"\"\n    配列の統計情報を表示する。\n    \"\"\"\n    st.subheader(\"解析結果サマリー\")\n    col1, col2, col3 = st.columns(3)\n    col1.metric(\"配列数\", len(records))\n\n    avg_len = sum(r.length for r in records) / len(records) if records else 0\n    col2.metric(\"平均長\", f\"{avg_len:.1f} bp\")\n\n    avg_gc = sum(r.gc_content for r in records) / len(records) if records else 0\n    col3.metric(\"平均GC含有量\", f\"{avg_gc:.1f} %\")\n\n    if records:\n        st.divider()\n        st.subheader(\"詳細解析\")\n\n        # 配列長の分布\n        st.write(\"### 配列長の分布\")\n        lengths = [r.length for r in records]\n        st.bar_chart(lengths)\n\n        # GC含有量の分布\n        st.write(\"### GC含有量の分布 (%)\")\n        gc_contents = [r.gc_content for r in records]\n        st.line_chart(gc_contents)\n\n        # 個別レコードの塩基組成\n        if len(records) == 1:\n            st.write(\"### 塩基組成\")\n            comp = records[0].base_composition\n            if comp:\n                df_comp = pd.DataFrame(list(comp.items()), columns=[\"Base\", \"Count\"])\n                st.bar_chart(df_comp.set_index(\"Base\"))\n\n\nasync def display_biowasm_ui(input_filename: str, input_content: Optional[str] = None) -> None:\n    \"\"\"\n    Wasmバイオ情報学ツールを操作するためのUIを表示する。\n\n    Args:\n        input_filename (str): 入力ファイルのパス（VFS内）。\n    \"\"\"\n    import time\n\n    tool_options = [\"seqtk\"]\n    selected_tool = st.selectbox(\"ツールを選択\", tool_options)\n\n\n    is_busy = st.session_state.get(\"is_processing\", False) or st.session_state.get(\"pyowasm_seqtk_job_id\") is not None\n\n    result_key = \"pyowasm_seqtk_last_result\"\n\n    if selected_tool == \"seqtk\":\n        from ..tasks.wasm.seqtk import SeqtkTask\n\n        command = st.text_input(\"コマンド引数\", value=\"seq -a\")\n\n        result_container = st.container()\n\n        job_key = \"pyowasm_seqtk_job_id\"\n        job_start_time_key = \"pyowasm_seqtk_job_start_time\"\n        task = SeqtkTask()\n\n        if st.button(\"🚀 Wasmで実行\", key=\"pyowasm_seqtk_run\", use_container_width=True, disabled=is_busy):\n            # 新しい実行の前に過去の結果をクリア\n            if result_key in st.session_state:\n                del st.session_state[result_key]\n                \n            job_id = task.start(input_filename, command, input_content=input_content)\n            if job_id.startswith(\"ERROR:\"):\n                with result_container:\n                    st.error(job_id.replace(\"ERROR:\", \"\", 1).strip())\n            else:\n                st.session_state[job_key] = job_id\n                st.session_state[job_start_time_key] = time.time()\n                # 実行開始時にオーバーレイを表示\n                st.markdown(\"<style>#loading-overlay { display: flex !important; }</style>\", unsafe_allow_html=True)\n                await asyncio.sleep(0.1)\n                st.rerun()\n\n        current_job_id = st.session_state.get(job_key)\n        if current_job_id:\n            # ポーリングループ\n            while True:\n                status = task.poll(str(current_job_id))\n                if status[\"status\"] == \"running\":\n                    elapsed = time.time() - st.session_state.get(job_start_time_key, time.time())\n                    with result_container:\n                        # 画面上の進捗表示\n                        st.info(f\"⏳ seqtk 実行中です... ({elapsed:.1f}秒経過)\")\n                    # オーバーレイを確実に表示\n                    st.markdown(\"<style>#loading-overlay { display: flex !important; }</style>\", unsafe_allow_html=True)\n                    await asyncio.sleep(0.5)\n                else:\n                    # 完了\n                    st.session_state[result_key] = status[\"result\"]\n                    task.cleanup(str(current_job_id))\n                    del st.session_state[job_key]\n                    if job_start_time_key in st.session_state:\n                        del st.session_state[job_start_time_key]\n                    # オーバーレイを消すためにリラン\n                    st.rerun()\n                    break\n\n        # 保存された結果がある場合は表示\n        if result_key in st.session_state:\n            with result_container:\n                task.render(st.session_state[result_key])\n\ndef display_header() -> None:\n    \"\"\"\n    アプリケーションのヘッダーとブランディングを表示する。\n    \"\"\"\n    st.title(\"🧬 Pyowasm\")\n    st.caption(\"Python × WebAssembly × Bioinformatics\")\n\n";

      const appCode = "import streamlit as st\nimport asyncio\nfrom pyowasm.ui.components import (\n    display_header, \n    render_analysis_mode, \n    render_seqtk_mode, \n    render_ortholog_mode\n)\n\nst.set_page_config(page_title=\"Pyowasm\", page_icon=\"🧬\", layout=\"wide\")\n\nasync def main():\n    # ヘッダー表示\n    display_header()\n\n    # サイドバーでの機能選択\n    st.sidebar.title(\"🛠️ 分析メニュー\")\n    mode = st.sidebar.radio(\n        \"実行するタスクを選択:\",\n        [\"1. 配列統計 (BioPython)\", \"2. Wasmツール (biowasm)\", \"3. オーソログ解析 (RBH)\"]\n    )\n\n    if mode == \"1. 配列統計 (BioPython)\":\n        await render_analysis_mode()\n    elif mode == \"2. Wasmツール (biowasm)\":\n        await render_seqtk_mode()\n    else:\n        await render_ortholog_mode()\n\nif __name__ == \"__main__\":\n    asyncio.run(main())\n";

      stlite.mount(
        {
          requirements: ["biopython", "pandas", "seaborn", "matplotlib"],
          entrypoint: "pyowasm/app.py",

            "pyowasm/tasks/local/__init__.py": "",
            "pyowasm/tasks/local/fasta_parser.py": fastaParserCode,
            "pyowasm/tasks/local/sequence_analyzer.py": sequenceAnalyzerCode,
            "pyowasm/tasks/wasm/__init__.py": "",
            "pyowasm/tasks/wasm/seqtk.py": seqtkTaskCode,
            "pyowasm/tasks/wasm/ortholog_analyzer.py": orthologAnalyzerCode,
            "pyowasm/core/__init__.py": "",
            "pyowasm/core/stats.py": statsCode,
            "pyowasm/bridge/__init__.py": "",
            "pyowasm/bridge/biowasm.py": biowasmBridgeCode,
            "pyowasm/ui/__init__.py": "",
            "pyowasm/ui/components.py": uiComponentsCode,
          },
          streamlitConfig: {
            "client.toolbarMode": "minimal",
          },
        },
        document.getElementById("root")
      );
    </script>
