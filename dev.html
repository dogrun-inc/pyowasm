      const fastaParserCode = `from io import StringIO
from Bio import SeqIO
from pyowasm.models.schema import SequenceRecord, AnalysisResult
from pyowasm.tasks.base import BaseTask

class FastaParserTask(BaseTask):
    def execute(self, fasta_content: str) -> AnalysisResult:
        records = []
        warnings: list[str] = []

        if not fasta_content.strip():
            return AnalysisResult(records=records, metadata={"warnings": warnings})

        first_non_empty_line = next((line for line in fasta_content.splitlines() if line.strip()), "")
        if first_non_empty_line and not first_non_empty_line.startswith(">"):
            warnings.append("FASTAヘッダ(\`>\`)から始まっていないため、入力形式が不正の可能性があります。")

        fasta_io = StringIO(fasta_content)
        try:
            for record in SeqIO.parse(fasta_io, "fasta"):
                records.append(SequenceRecord(
                    id=str(record.id),
                    description=str(record.description),
                    sequence=str(record.seq),
                    length=len(record.seq)
                ))
        except ValueError as error:
            warnings.append(f"FASTAのパース中に警告が発生しました: {error}")

        return AnalysisResult(records=records, metadata={"warnings": warnings})
`;

      const sequenceAnalyzerCode = `from Bio.SeqUtils import gc_fraction
from pyowasm.models.schema import SequenceRecord, AnalysisResult
from pyowasm.tasks.base import BaseTask

class SequenceAnalysisTask(BaseTask):
    def execute(self, records: list[SequenceRecord]) -> AnalysisResult:
        for record in records:
            record.gc_content = gc_fraction(record.sequence) * 100
            composition: dict[str, int] = {}
            for base in record.sequence.upper():
                if base.isalpha():
                    composition[base] = composition.get(base, 0) + 1
            record.base_composition = composition
        return AnalysisResult(records=records)
`;

      const schemaCode = `from dataclasses import dataclass
from typing import List, Optional

@dataclass
class SequenceRecord:
    id: str
    description: str
    sequence: str
    length: int
    gc_content: float = 0.0
    base_composition: Optional[dict[str, int]] = None

@dataclass
class AnalysisResult:
    records: List[SequenceRecord]
    metadata: Optional[dict] = None
`;

      const uiComponentsCode = `import streamlit as st
import pandas as pd
from typing import List
from pyowasm.models.schema import SequenceRecord

def display_sequence_stats(records: List[SequenceRecord]) -> None:
    st.subheader("解析結果サマリー")
    col1, col2, col3 = st.columns(3)
    col1.metric("配列数", len(records))
    avg_len = sum(r.length for r in records) / len(records) if records else 0
    col2.metric("平均長", f"{avg_len:.1f} bp")
    avg_gc = sum(r.gc_content for r in records) / len(records) if records else 0
    col3.metric("平均GC含有量", f"{avg_gc:.1f} %")

    if records:
        st.divider()
        st.subheader("詳細解析")
        st.write("### 配列長の分布")
        lengths = [r.length for r in records]
        st.bar_chart(lengths)
        st.write("### GC含有量の分布 (%)")
        gc_contents = [r.gc_content for r in records]
        st.line_chart(gc_contents)
        if len(records) == 1:
            st.write("### 塩基組成")
            comp = records[0].base_composition
            if comp:
                df_comp = pd.DataFrame(list(comp.items()), columns=["Base", "Count"])
                st.bar_chart(df_comp.set_index("Base"))

def display_header() -> None:
    st.title("🧬 Pyowasm")
    st.caption("Python × WebAssembly × Bioinformatics")
    st.markdown("### 🚀 ブラウザが次世代の解析プラットフォームになる\\n**Pyowasm** は、環境構築不要のバイオ解析環境です。")
`;

      const appCode = `import streamlit as st
from pyowasm.ui.components import display_header, display_sequence_stats
from pyowasm.tasks.local.fasta_parser import FastaParserTask
from pyowasm.tasks.local.sequence_analyzer import SequenceAnalysisTask

st.set_page_config(page_title="Pyowasm", page_icon="🧬")

display_header()

uploaded_file = st.file_uploader("FASTAファイルをドロップ", type=["fasta"])

if uploaded_file:
    with st.status("Python (Wasm) で解析中...", expanded=True) as status:
        fasta_data = uploaded_file.getvalue().decode("utf-8")
        parser = FastaParserTask()
        parse_result = parser.execute(fasta_data)
        warnings = (parse_result.metadata or {}).get("warnings", [])
        for warning in warnings:
            st.warning(warning)
        st.write(f"BioPythonを使用して {len(parse_result.records)} 個の配列をパースしました。")
        analyzer = SequenceAnalysisTask()
        analysis_result = analyzer.execute(parse_result.records)
        status.update(label="解析完了!", state="complete", expanded=False)

    st.divider()
    display_sequence_stats(analysis_result.records)
`;

      const vfsManagerCode = `import js
      import os

      class VFSManager:
      @staticmethod
      def write_to_vfs(filename: str, content: str) -> str:
        try:
            js.FS.writeFile(filename, content)
            js.console.log(f"[Pyowasm/VFS] File written: {filename}")
            return filename
        except AttributeError:
            os.makedirs(os.path.dirname(filename) if os.path.dirname(filename) else ".", exist_ok=True)
            with open(filename, "w") as f:
                f.write(content)
            return filename

      @staticmethod
      def read_from_vfs(filename: str) -> str:
        try:
            data = js.FS.readFile(filename, {"encoding": "utf8"})
            return str(data)
        except AttributeError:
            if os.path.exists(filename):
                with open(filename, "r") as f:
                    return f.read()
            raise FileNotFoundError(f"File not found: {filename}")
      `;
